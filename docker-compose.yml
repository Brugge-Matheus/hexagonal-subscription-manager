services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: subscription_manager
      POSTGRES_USER: subscription_manager
      POSTGRES_PASSWORD: subscription_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subscription_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      REPOSITORY: db
      DATABASE_URL: postgres://subscription_manager:subscription_manager@postgres:5432/subscription_manager?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
